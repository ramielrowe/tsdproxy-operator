name: Publish Image

# Runs lint, the tests and the e2e suite, and only when all three pass builds
# the operator image for amd64 and arm64 and pushes it to
# ghcr.io/<owner>/<repository>.
#
#   push to main  ->  :main and :sha-<short commit>
#   tag v1.2.3    ->  :1.2.3, :1.2 and :latest
#   tag v1.2.3-rc.1 (pre-release)  ->  :1.2.3-rc.1 only
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions: {}

# Never cancel a push halfway; queue behind the run for the same ref instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks are the same workflows that run for pull requests and other
  # branches. They do not trigger themselves for main or tags, so each runs
  # once per push.
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  test-e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/test-e2e.yml

  publish:
    name: Build and push to ghcr.io
    needs:
      - lint
      - test
      - test-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      # Same transformation as "make docker-buildx": run the build stage on
      # the runner's own platform and let Go cross-compile, instead of
      # emulating the target platform for the whole compile.
      - name: Prepare the cross-platform Dockerfile
        run: |
          # ${BUILDPLATFORM} is for Docker, not the shell, to expand.
          # shellcheck disable=SC2016
          sed '0,/^FROM /s//FROM --platform=${BUILDPLATFORM} /' Dockerfile > Dockerfile.cross
          grep -n '^FROM' Dockerfile.cross
          grep -q '^FROM --platform=' Dockerfile.cross

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.cross
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
